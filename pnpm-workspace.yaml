  nanoid: 5.1.16
  postcss: 8.5.23
  sharp: 0.35.5
  tinypool: 2.1.2
  tsdown: 0.22.14
  typescript: 6.0.3
  unplugin-vue: 7.2.0
  vite: 8.1.6
  vue: 3.5.42
  vue-router: 5.2.0
